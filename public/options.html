<!doctype html>
<html lang="en" data-theme="light">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css" rel="stylesheet" type="text/css" />
  <link rel="stylesheet" href="options.css" />
</head>

<body>
  <h1>Twight — Settings</h1>

  <section class="card">
    <h2>Account</h2>
    <p id="account-status" class="muted">Checking sign-in…</p>
    <p id="drafts-status" class="muted"></p>
    <div class="actions">
      <button id="sign-in" class="btn primary hidden" type="button">Sign in with Google</button>
      <button id="buy-drafts" class="btn primary hidden" type="button">Buy drafts</button>
      <button id="refresh-drafts" class="btn ghost hidden" type="button">Refresh balance</button>
      <button id="sign-out" class="btn ghost hidden" type="button">Sign out</button>
    </div>
  </section>

  <section class="card">
    <h2>Bring your own API key</h2>
    <p class="note">Coming soon. For now Twight uses hosted drafts.</p>
  </section>

  <p id="status" class="muted"></p>

  <script src="options.js"></script>
</body>

</html>
