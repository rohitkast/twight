<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="options.css" />
</head>

<body>
  <h1>Reddit Reply Assistant — Settings</h1>

  <label for="key">Anthropic API key (Claude)</label>
  <input id="key" type="password" placeholder="sk-ant-..." autocomplete="off" />

  <label for="gemini-key">Google API key (Gemini)</label>
  <input id="gemini-key" type="password" placeholder="AIza..." autocomplete="off" />

  <button id="save">Save</button>
  <p id="status" class="muted"></p>

  <p class="note">
    Keys are stored in this browser's extension storage
    (<code>chrome.storage.local</code>) and sent only to their respective
    APIs (<code>api.anthropic.com</code> or <code>generativelanguage.googleapis.com</code>).
    Don't distribute this build — the keys would ship with it.
  </p>

  <script src="options.js"></script>
</body>

</html>
