<!doctype html>
<html lang="en" data-theme="light">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css" rel="stylesheet" type="text/css" />
  <link rel="stylesheet" href="rra-tokens.css" />
  <link rel="stylesheet" href="sidepanel.css" />
</head>

<body class="rra-app">
  <header>
    <div class="brand">
      <span class="title">Twight</span>
      <span class="subtitle">Reddit Reply Assistant</span>
    </div>
    <div class="header-actions">
      <button id="history-back" class="btn btn-ghost btn-square btn-sm hidden" title="Back" aria-label="Back">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"
          width="16" height="16">
          <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5 3 12m0 0 7.5-7.5M3 12h18" />
        </svg>
      </button>
      <button id="chatlist-btn" class="btn btn-ghost btn-square btn-sm" title="Chat list — people you've outreached"
        aria-label="Chat list">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"
          width="17" height="17">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M15 19.128a9.38 9.38 0 0 0 2.625.372 9.337 9.337 0 0 0 4.121-.952 4.125 4.125 0 0 0-7.533-2.493M15 19.128v-.003c0-1.113-.285-2.16-.786-3.07M15 19.128v.106A12.318 12.318 0 0 1 8.624 21c-2.331 0-4.512-.645-6.374-1.766l-.001-.109a6.375 6.375 0 0 1 11.964-3.07M12 6.375a3.375 3.375 0 1 1-6.75 0 3.375 3.375 0 0 1 6.75 0Zm8.25 2.25a2.625 2.625 0 1 1-5.25 0 2.625 2.625 0 0 1 5.25 0Z" />
        </svg>
      </button>
      <button id="settings" class="btn btn-ghost btn-square btn-sm" title="Settings" aria-label="Settings">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"
          width="17" height="17">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.325.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 0 1 1.37.49l1.296 2.247a1.125 1.125 0 0 1-.26 1.431l-1.003.827c-.293.241-.438.613-.43.992a7.723 7.723 0 0 1 0 .255c-.008.378.137.75.43.991l1.004.827c.424.35.534.955.26 1.43l-1.298 2.247a1.125 1.125 0 0 1-1.369.491l-1.217-.456c-.355-.133-.75-.072-1.076.124a6.47 6.47 0 0 1-.22.128c-.331.183-.581.495-.644.869l-.213 1.281c-.09.543-.56.94-1.11.94h-2.594c-.55 0-1.019-.398-1.11-.94l-.213-1.281c-.062-.374-.312-.686-.644-.87a6.52 6.52 0 0 1-.22-.127c-.325-.196-.72-.257-1.076-.124l-1.217.456a1.125 1.125 0 0 1-1.369-.49l-1.297-2.247a1.125 1.125 0 0 1 .26-1.431l1.004-.827c.292-.24.437-.613.43-.991a6.932 6.932 0 0 1 0-.255c.007-.38-.138-.751-.43-.992l-1.004-.827a1.125 1.125 0 0 1-.26-1.43l1.297-2.247a1.125 1.125 0 0 1 1.37-.491l1.216.456c.356.133.751.072 1.076-.124.072-.044.146-.086.22-.128.332-.183.582-.495.644-.869l.214-1.28Z" />
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
        </svg>
      </button>
    </div>
  </header>

  <section id="context">
    <div id="mode-bar" role="tablist" aria-label="Panel mode">
      <button id="live-mode" class="mode-btn btn btn-sm active" role="tab" aria-selected="true">Live chat</button>
      <button id="history-mode" class="mode-btn btn btn-sm" role="tab" aria-selected="false">History</button>
    </div>
    <div id="goal-bar">
      <select id="goal-select" class="select select-sm" aria-label="Active goal"></select>
      <button id="manage-goals" class="btn btn-sm btn-ghost btn-square" title="Add / manage goals"
        aria-label="Manage goals">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"
          width="16" height="16">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
        </svg>
      </button>
    </div>
    <div id="load-bar">
      <button id="load" class="btn btn-sm">Load thread from page</button>
      <button id="clear" class="btn btn-sm btn-ghost">Clear</button>
    </div>
    <div id="thread-summary" class="muted">No thread loaded.</div>
    <div id="history-list" class="hidden"></div>
  </section>

  <main id="chat"></main>

  <footer id="composer">
    <div id="composer-options">
      <div id="composer-left">
        <select id="model-select" class="select select-sm" aria-label="AI model" title="Select AI model">
          <option value="claude">Claude Sonnet 4.5</option>
          <option value="gemini">Gemini 3.5 Flash</option>
        </select>
        <label id="comment-toggle" class="whitespace-nowrap" for="include-comments"
          title="When off, drafts focus on DMs only">
          <input id="include-comments" type="checkbox" checked />
          <span class="whitespace-nowrap">Include comments</span>
        </label>
      </div>
      <button id="instruction-toggle" type="button" class="btn btn-sm btn-ghost">+ Instruction</button>
    </div>
    <textarea id="input" rows="2" class="textarea textarea-sm hidden"
      placeholder="e.g. DMs only · focus on u/someuser · skip OP"></textarea>
    <button id="generate-btn" class="btn btn-primary btn-block">Generate</button>
  </footer>

  <!-- Feedback modal -->
  <div id="feedback-overlay" class="hidden" role="dialog" aria-modal="true" aria-labelledby="feedback-title">
    <div id="feedback-card">
      <p id="feedback-title" class="feedback-heading">Quick question</p>
      <p class="feedback-sub">We're building this in the open — would love to know where you're at!</p>
      <div id="feedback-moods">
        <button type="button" class="mood-btn btn btn-sm btn-outline btn-block" data-mood="Loving it">Loving it</button>
        <button type="button" class="mood-btn btn btn-sm btn-outline btn-block" data-mood="It's okay">It's okay</button>
        <button type="button" class="mood-btn btn btn-sm btn-outline btn-block" data-mood="Not for me">Not for
          me</button>
      </div>
      <textarea id="feedback-text" class="textarea textarea-sm" rows="2"
        placeholder="Anything specific? (optional)"></textarea>
      <div class="feedback-actions">
        <button id="feedback-send" class="btn btn-sm btn-primary" type="button" disabled>Send anonymously</button>
        <button id="feedback-later" class="btn btn-sm btn-ghost" type="button">Maybe later</button>
      </div>
    </div>
  </div>

  <script src="sidepanel.js"></script>
</body>

</html>
