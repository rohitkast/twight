<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="sidepanel.css" />
</head>

<body>
  <header>
    <span class="title">Reddit Reply Assistant</span>
    <div class="header-actions">
      <button id="history-back" class="hidden" title="Back" aria-label="Back">🕘</button>
      <button id="chatlist-btn" title="Chat list — people you've outreached" aria-label="Chat list">👥</button>
      <button id="settings" title="Settings" aria-label="Settings">⚙</button>
    </div>
  </header>

  <section id="context">
    <div id="mode-bar" role="tablist" aria-label="Panel mode">
      <button id="live-mode" class="mode-btn active" role="tab" aria-selected="true">Live chat</button>
      <button id="history-mode" class="mode-btn" role="tab" aria-selected="false">History</button>
    </div>
    <div id="goal-bar">
      <select id="goal-select" aria-label="Active goal"></select>
      <button id="manage-goals" title="Add / manage goals" aria-label="Manage goals">+</button>
    </div>
    <div id="load-bar">
      <button id="load">Load thread from page</button>
      <button id="clear" title="Clear chat and reset thread">Clear</button>
    </div>
    <div id="thread-summary" class="muted">No thread loaded.</div>
    <div id="history-list" class="hidden"></div>
  </section>

  <main id="chat"></main>

  <footer id="composer">
    <div id="composer-options">
      <div id="composer-left">
        <select id="model-select" aria-label="AI model" title="Select AI model">
          <option value="claude">Claude Sonnet 4.5</option>
          <option value="gemini">Gemini 3.5 Flash</option>
        </select>
        <label id="comment-toggle" for="include-comments" title="When off, drafts focus on DMs only">
          <input id="include-comments" type="checkbox" checked />
          <span>Include comments</span>
        </label>
      </div>
      <button id="instruction-toggle" type="button">+ Instruction</button>
    </div>
    <textarea id="input" rows="2" class="hidden" placeholder="e.g. DMs only · focus on u/someuser · skip OP"></textarea>
    <button id="generate-btn">Generate</button>
  </footer>

  <!-- Feedback modal -->
  <div id="feedback-overlay" class="hidden" role="dialog" aria-modal="true" aria-labelledby="feedback-title">
    <div id="feedback-card">
      <p id="feedback-title" class="feedback-heading">Quick question 👋</p>
      <p class="feedback-sub">We're building this in the open — would love to know where you're at!</p>
      <div id="feedback-moods">
        <button type="button" class="mood-btn" data-mood="Loving it 🙌">Loving it 🙌</button>
        <button type="button" class="mood-btn" data-mood="It's okay 🤔">It's okay 🤔</button>
        <button type="button" class="mood-btn" data-mood="Not for me 🚫">Not for me 🚫</button>
      </div>
      <textarea id="feedback-text" rows="2" placeholder="Anything specific? (optional)"></textarea>
      <div class="feedback-actions">
        <button id="feedback-send" type="button" disabled>Send anonymously</button>
        <button id="feedback-later" type="button">Maybe later</button>
      </div>
    </div>
  </div>

  <script src="sidepanel.js"></script>
</body>

</html>
